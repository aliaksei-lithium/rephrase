<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fix and lightly rephrase messages while keeping your own voice and formatting.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="bingbot" content="noindex, nofollow">
    <title>Rephrase Tool</title>
    <meta property="og:title" content="Rephrase Tool">
    <meta property="og:description" content="Fix and lightly rephrase messages while keeping your own voice and formatting.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://rephrase-eey.pages.dev/preview.jpg">
    <meta property="og:url" content="https://rephrase-eey.pages.dev/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Rephrase Tool">
    <meta name="twitter:description" content="Fix and lightly rephrase messages while keeping your own voice and formatting.">
    <meta name="twitter:image" content="https://rephrase-eey.pages.dev/preview.jpg">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.2.0/turndown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="top-bar">
            <div class="brand">Rephrase</div>
            <div class="top-bar-right">
                <label class="model-label" for="modelSelect">Model</label>
                <select id="modelSelect" class="language-select" aria-label="Model"></select>
                <button id="logoutBtn" class="link-btn" type="button" hidden>Sign out</button>
            </div>
        </header>
        <main class="main-content">
            <section class="input-section">
                <button id="cleanupBtn" class="cleanup-btn" aria-label="Clear all" title="Clear">×</button>
                <div
                    id="inputText"
                    class="text-area editor"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    aria-label="Text to rephrase"
                    data-placeholder="Paste or type text to rephrase. Formatted text keeps its formatting. Cmd/Ctrl+Enter to run."
                ></div>
            </section>
            <section class="output-section">
                <div id="progressBar" class="progress" hidden><div id="progressFill" class="progress-fill"></div></div>
                <div class="output-actions">
                    <button id="copyMdBtn" class="copy-btn small" aria-label="Copy as Markdown" title="Copy as Markdown">MD</button>
                    <button id="copyBtn" class="copy-btn" aria-label="Copy to clipboard" title="Copy with formatting">📋</button>
                </div>
                <div id="outputText" class="text-area output-area" aria-live="polite"></div>
            </section>
            <section class="config-section" id="configSection">
                <div class="config-group">
                    <label for="languageSelect">Language</label>
                    <select id="languageSelect" class="config-select">
                        <option value="auto" selected>Auto</option>
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                    </select>
                </div>
                <div class="config-group">
                    <label>Mode</label>
                    <div class="segmented" id="modeGroup" role="radiogroup" aria-label="Mode">
                        <button type="button" class="seg-btn" data-mode="simple" title="Fix typos, grammar, tense, word order and wrong words only">Simple</button>
                        <button type="button" class="seg-btn active" data-mode="default" title="Light rephrase, same voice">Default</button>
                    </div>
                </div>
                <div class="config-group">
                    <label for="styleSelect">Style</label>
                    <select id="styleSelect" class="config-select">
                        <option value="keep" selected>Keep mine</option>
                        <option value="casual">Casual</option>
                        <option value="business">Business</option>
                        <option value="academic">Academic</option>
                    </select>
                </div>
                <div class="config-group">
                    <label for="toneSelect">Tone</label>
                    <select id="toneSelect" class="config-select">
                        <option value="keep" selected>Keep mine</option>
                        <option value="friendly">Friendly</option>
                        <option value="confident">Confident</option>
                        <option value="diplomatic">Diplomatic</option>
                        <option value="enthusiastic">Enthusiastic</option>
                    </select>
                </div>
                <button id="rephraseBtn" class="primary-btn" type="button">Rephrase <span class="kbd">⌘↵</span></button>
                <div class="config-toggles">
                    <label class="toggle"><input type="checkbox" id="showDiff" checked> Show changes</label>
                    <label class="toggle"><input type="checkbox" id="autoRun"> Auto-run while typing</label>
                </div>
                <div id="statusInfo" class="usage-info">
                    <div class="usage-loading">Ready.</div>
                </div>
            </section>
        </main>
    </div>

    <div id="errorToolbox" class="error-toolbox">
        <div class="error-toolbox-header">
            <span class="error-toolbox-title">Error Details</span>
            <button id="closeToolboxBtn" class="close-toolbox-btn" aria-label="Close">×</button>
        </div>
        <div id="errorToolboxContent" class="error-toolbox-content"></div>
    </div>

    <div id="loginOverlay" class="login-overlay" hidden>
        <form id="loginForm" class="login-card" autocomplete="on">
            <h1>Rephrase</h1>
            <p>Enter the password to continue. You stay signed in on this device.</p>
            <input id="passwordInput" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
            <button type="submit" class="primary-btn" id="loginBtn">Sign in</button>
            <div id="loginError" class="login-error" role="alert"></div>
        </form>
    </div>

    <script src="editor.js"></script>
    <script src="script.js"></script>
</body>
</html>
